{% if success %}
<div class="alert alert-success">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    <div>
        <p class="font-semibold">Device saved!</p>
        <p class="text-sm">{{ device.brand }} {{ device.model_name }} — {{ device.serial_number }}</p>
        <a href="{% url 'device_detail' pk=device.pk %}" class="link link-primary text-sm">View device</a>
        <span class="mx-1">|</span>
        <button type="button" class="link link-primary text-sm" onclick="resetScanner()">Scan another</button>
    </div>
</div>
{% else %}
<div class="alert alert-error">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z" />
    </svg>
    <div>
        <p class="font-semibold">Could not save device</p>
        <ul class="text-sm list-disc list-inside">
            {% for err in errors %}
            <li>{{ err }}</li>
            {% endfor %}
        </ul>
    </div>
</div>
{% endif %}
