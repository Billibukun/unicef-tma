{% extends "base.html" %}
{% block title %}Edit User — UNICEF TMA{% endblock %}
{% block content %}
<a href="{% url 'admin_tools' %}" class="inline-flex items-center gap-1 text-sm text-gray-400 hover:text-[#1CABE2] mb-5">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>Back
</a>

<div class="bg-white rounded-xl border border-gray-200 max-w-2xl mx-auto">
    <div class="px-6 py-4 border-b border-gray-200">
        <h2 class="text-lg font-semibold text-[#1A1A1A]">Edit User: {{ edit_user.username }}</h2>
    </div>
    <form method="post" class="p-6">
        {% csrf_token %}
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-5 gap-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">First Name</label>
                <input type="text" name="first_name" value="{{ edit_user.first_name }}" class="w-full px-3 py-2.5 rounded-lg border border-gray-300 text-sm focus:border-[#1CABE2] outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Last Name</label>
                <input type="text" name="last_name" value="{{ edit_user.last_name }}" class="w-full px-3 py-2.5 rounded-lg border border-gray-300 text-sm focus:border-[#1CABE2] outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Email</label>
                <input type="email" name="email" value="{{ edit_user.email }}" class="w-full px-3 py-2.5 rounded-lg border border-gray-300 text-sm focus:border-[#1CABE2] outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Phone</label>
                <input type="text" name="phone" value="{{ edit_user.phone }}" class="w-full px-3 py-2.5 rounded-lg border border-gray-300 text-sm focus:border-[#1CABE2] outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Channel</label>
                <select name="channel" class="w-full px-3 py-2.5 rounded-lg border border-gray-300 text-sm bg-white focus:border-[#1CABE2] outline-none">
                    <option value="">— None —</option>
                    {% for ch in channels %}<option value="{{ ch.pk }}" {% if edit_user.channel_id == ch.pk %}selected{% endif %}>{{ ch.name }}</option>{% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">State</label>
                <select name="state" class="w-full px-3 py-2.5 rounded-lg border border-gray-300 text-sm bg-white focus:border-[#1CABE2] outline-none">
                    <option value="">— None —</option>
                    {% for s in states %}<option value="{{ s.pk }}" {% if edit_user.state_id == s.pk %}selected{% endif %}>{{ s.name }}</option>{% endfor %}
                </select>
            </div>
        </div>

        <div class="mt-5">
            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Groups / Roles</label>
            <div class="flex flex-wrap gap-2">
                {% for g in groups %}
                <label class="flex items-center gap-1.5 text-sm text-[#1A1A1A] cursor-pointer bg-[#F0F0F0] px-3 py-1.5 rounded-lg">
                    <input type="checkbox" name="groups" value="{{ g.pk }}" {% if g.pk in user_groups %}checked{% endif %} class="w-4 h-4 rounded border-gray-300 text-[#1CABE2]">
                    {{ g.name }}
                </label>
                {% endfor %}
            </div>
        </div>

        <div class="flex items-center justify-end gap-3 pt-5 mt-6 border-t border-gray-200">
            <a href="{% url 'admin_tools' %}" class="px-4 py-2.5 text-sm font-medium text-gray-500">Cancel</a>
            <button type="submit" class="px-5 py-2.5 bg-[#1CABE2] hover:bg-[#158fb8] text-white text-sm font-medium rounded-lg">Save User</button>
        </div>
    </form>
</div>
{% endblock %}
