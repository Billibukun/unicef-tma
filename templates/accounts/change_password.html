{% extends "base.html" %}
{% block title %}Change Password — UNICEF TMA{% endblock %}
{% block content %}
<div class="bg-white rounded-xl border border-gray-200 max-w-md mx-auto">
    <div class="px-6 py-4 border-b border-gray-200">
        <h2 class="text-lg font-semibold text-[#1A1A1A]">Change Password</h2>
    </div>
    <form method="post" class="p-6 space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Current Password</label>
            <input type="password" name="current_password" required class="w-full px-3 py-2.5 rounded-lg border border-gray-300 text-sm focus:border-[#1CABE2] outline-none">
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">New Password</label>
            <input type="password" name="new_password" required minlength="6" class="w-full px-3 py-2.5 rounded-lg border border-gray-300 text-sm focus:border-[#1CABE2] outline-none">
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Confirm New Password</label>
            <input type="password" name="confirm_password" required minlength="6" class="w-full px-3 py-2.5 rounded-lg border border-gray-300 text-sm focus:border-[#1CABE2] outline-none">
        </div>
        <button type="submit" class="w-full px-5 py-2.5 bg-[#1CABE2] hover:bg-[#158fb8] text-white text-sm font-medium rounded-lg">Change Password</button>
    </form>
</div>
{% endblock %}
