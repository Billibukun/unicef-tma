<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — UNICEF TMA</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#1CABE2] min-h-screen flex items-center justify-center px-4">
<div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8">
    <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-14 h-14 bg-[#1CABE2] rounded-xl mb-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
        </div>
        <h1 class="text-xl font-bold text-[#1A1A1A]">Forgot Password</h1>
        <p class="text-sm text-gray-500 mt-1">Enter your email and we'll send a reset link.</p>
    </div>
    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1.5">Email Address</label>
            <input type="email" name="email" required class="w-full px-4 py-3 rounded-xl border border-gray-300 text-sm focus:border-[#1CABE2] focus:ring-2 focus:ring-[#1CABE2]/20 outline-none">
        </div>
        <button type="submit" class="w-full py-3 bg-[#1CABE2] hover:bg-[#158fb8] text-white font-semibold rounded-xl">Send Reset Link</button>
    </form>
    <p class="text-center text-xs text-gray-400 mt-4"><a href="{% url 'login' %}" class="text-[#1CABE2] hover:underline">Back to Login</a></p>
    <p class="text-center text-[10px] text-gray-300 mt-6">Developed by Ibukunoluwa Omonijo</p>
</div>
</body>
</html>
