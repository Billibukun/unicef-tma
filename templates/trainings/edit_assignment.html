{% extends "base.html" %}
{% block title %}Edit Assignment — UNICEF TMA{% endblock %}
{% block content %}
<a href="{% url 'training_detail' assignment.training.pk %}" class="inline-flex items-center gap-1 text-sm text-gray-400 hover:text-[#1CABE2] mb-5">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    Back to {{ assignment.training.title }}
</a>

<div class="bg-white rounded-xl border border-gray-200 max-w-2xl mx-auto">
    <div class="px-6 py-4 border-b border-gray-200">
        <h2 class="text-lg font-semibold text-[#1A1A1A]">Edit Training Assignment</h2>
        <p class="text-xs text-gray-500 mt-0.5">{{ assignment.participant.full_name }} — {{ assignment.training.title }}</p>
    </div>

    <form method="post" class="p-6">
        {% csrf_token %}

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-5 gap-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Category (Role)</label>
                <select name="category" class="w-full px-3 py-2.5 rounded-lg border border-gray-300 text-sm bg-white focus:border-[#1CABE2] outline-none">
                    <option value="">— Select —</option>
                    {% for c in categories %}
                    <option value="{{ c.pk }}" {% if assignment.training_category_id == c.pk %}selected{% endif %}>{{ c.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Cluster</label>
                <select name="cluster" class="w-full px-3 py-2.5 rounded-lg border border-gray-300 text-sm bg-white focus:border-[#1CABE2] outline-none">
                    <option value="">— No Cluster —</option>
                    {% for cl in clusters %}
                    <option value="{{ cl.pk }}" {% if assignment.cluster_id == cl.pk %}selected{% endif %}>{{ cl.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Role</label>
                <select name="role" class="w-full px-3 py-2.5 rounded-lg border border-gray-300 text-sm bg-white focus:border-[#1CABE2] outline-none">
                    <option value="">— Select —</option>
                    {% for r in roles %}
                    <option value="{{ r.pk }}" {% if assignment.role_id == r.pk %}selected{% endif %}>{{ r }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="flex items-center justify-end gap-3 pt-5 mt-6 border-t border-gray-200">
            <a href="{% url 'training_detail' assignment.training.pk %}" class="px-4 py-2.5 text-sm font-medium text-gray-500">Cancel</a>
            <button type="submit" class="px-5 py-2.5 bg-[#1CABE2] hover:bg-[#158fb8] text-white text-sm font-medium rounded-lg">Save</button>
        </div>
    </form>
</div>
{% endblock %}
